name: vibepad-browser

services:
  chrome:
    image: ${VIBEPAD_BROWSER_IMAGE}
    platform: linux/amd64
    entrypoint:
      - /bin/sh
      - /opt/vibepad/chrome-entrypoint.sh
    command:
      - --wait
    shm_size: 512m
    ports:
      - "127.0.0.1:${VIBEPAD_BROWSER_SURFACE_PORT}:8080"
      - "127.0.0.1:${VIBEPAD_BROWSER_CDP_PORT}:9223"
    environment:
      APP_ARGS: >-
        --start-maximized
        --restore-last-session
        --disable-session-crashed-bubble
        --user-data-dir=/home/kasm-user/.config/google-chrome-vibepad
        --disk-cache-dir=/home/kasm-user/.cache/google-chrome-vibepad
        --remote-debugging-port=9222
        --remote-allow-origins=*
      KASMVNC_AUTO_RECOVER: "true"
      KASM_SVC_PRINTER: "0"
      KASM_SVC_SMARTCARD: "0"
      VNCOPTIONS: -SecurityTypes None -DisableBasicAuth 1
    volumes:
      - type: bind
        source: ${VIBEPAD_BROWSER_ENTRYPOINT}
        target: /opt/vibepad/chrome-entrypoint.sh
        read_only: true
      - type: bind
        source: ${VIBEPAD_BROWSER_PROFILE_DIR}
        target: /home/kasm-user
      - type: bind
        source: ${VIBEPAD_BROWSER_CACHE_DIR}
        target: /home/kasm-user/.cache
      - type: bind
        source: ${VIBEPAD_BROWSER_DOWNLOAD_DIR}
        target: /home/kasm-user/Downloads
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9222/json/version >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    restart: unless-stopped

  cdp-bridge:
    image: alpine/socat:1.8.1.3
    network_mode: service:chrome
    command:
      - TCP-LISTEN:9223,fork,reuseaddr,bind=0.0.0.0
      - TCP-CONNECT:127.0.0.1:9222
    depends_on:
      chrome:
        condition: service_healthy
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  surface-proxy:
    image: nginxinc/nginx-unprivileged:1.29.5-alpine
    network_mode: service:chrome
    depends_on:
      chrome:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${VIBEPAD_BROWSER_PROXY_CONFIG}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/vnc.html >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
