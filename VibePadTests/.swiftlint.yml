# XCTest fixtures intentionally use trapping construction for values that are
# compile-time constants. Production targets keep these safety rules enabled.
disabled_rules:
  - empty_string
  - explicit_boolean_comparison
  - force_try
  - force_unwrapping
  - identical_operands
  - identifier_name
  - implicitly_unwrapped_optional
  - file_length
  - type_body_length
