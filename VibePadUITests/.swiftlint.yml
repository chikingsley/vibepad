# XCTest owns the lifecycle of these implicitly unwrapped application handles.
# Production targets keep these safety rules enabled.
disabled_rules:
  - balanced_xctest_lifecycle
  - explicit_boolean_comparison
  - force_try
  - force_unwrapping
  - identifier_name
  - implicitly_unwrapped_optional
  - static_over_final_class
  - unneeded_throws_rethrows
  - file_length
  - type_body_length
