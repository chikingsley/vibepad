appId: studio.peacockery.vibepad
name: VibePad shell smoke
---
- stopApp
- launchApp
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible:
      id: workspace-sidebar
    timeout: 30000
- assertVisible:
    id: sidebar-toggle
- assertVisible:
    id: header-host-status
- assertVisible:
    id: header-session-context
- assertVisible:
    id: new-session-trigger
- assertVisible:
    id: session-workbench-controls
- assertVisible:
    id: session-canvas
- tapOn:
    id: session-surface-chat
- assertVisible:
    id: message-send-inactive
- tapOn:
    id: sidebar-toggle
- waitForAnimationToEnd
- assertNotVisible:
    id: workspace-sidebar
- tapOn:
    id: sidebar-toggle
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: workspace-sidebar
    timeout: 5000
- tapOn:
    id: message-composer
- inputText: "Composer state"
- assertVisible:
    id: message-send-active
- takeScreenshot: shell-header-composer-text
- eraseText
- hideKeyboard
- assertVisible:
    id: message-send-inactive
- runFlow:
    when:
      visible:
        id: system-status-trigger
    commands:
      - tapOn:
          id: system-status-trigger
