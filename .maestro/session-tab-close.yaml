appId: host.exp.Exponent
name: VibePad session working-set close
---
- launchApp
- openLink: ${EXPO_URL}
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible:
      id: selected-session-close
    timeout: 30000
- tapOn:
    id: selected-session-close
- assertVisible:
    id: empty-session-canvas
- assertNotVisible:
    id: message-composer
