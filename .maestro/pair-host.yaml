appId: studio.peacockery.vibepad
name: Pair VibePad host
---
- launchApp
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: host-pairing-code
    timeout: 30000
- assertVisible: "Found .*"
- tapOn:
    id: host-pairing-code
- eraseText
- inputText: ${PAIRING_CODE}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: session-canvas
    timeout: 30000
- assertVisible:
    id: workspace-sidebar
- assertVisible:
    id: header-host-status
