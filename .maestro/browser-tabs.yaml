appId: studio.peacockery.vibepad
name: VibePad persistent browser tabs
---
- stopApp
- launchApp
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible:
      id: session-surface-preview
    timeout: 30000
- tapOn:
    id: session-surface-preview
- extendedWaitUntil:
    visible:
      id: browser-tab-strip
    timeout: 30000
- assertVisible:
    text: Close browser tab about:blank
- tapOn:
    id: browser-new-tab
- extendedWaitUntil:
    visible:
      text: Close browser tab Google.*
    timeout: 30000
- takeScreenshot: browser-tabs-google
- tapOn:
    text: Close browser tab Google.*
- assertNotVisible:
    text: Close browser tab Google.*
- assertVisible:
    text: Close browser tab about:blank
