name: VibePad Host release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version
        required: true
        default: 0.1.2
      publish:
        description: Upload verified artifacts to Cloudflare R2
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run host:release --target "${{ matrix.target }}" --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vibepad-host-${{ matrix.target }}
          path: |
            dist/host/*.tar.gz
            dist/host/*.sha256
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    env:
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Require Apple release credentials for publication
        if: ${{ inputs.publish && env.MACOS_DEVELOPER_IDENTITY == '' }}
        run: |
          printf 'MACOS_DEVELOPER_IDENTITY and the Apple release secrets are required for publication.\n' >&2
          exit 1
      - name: Configure Developer ID and notarization
        if: ${{ env.MACOS_DEVELOPER_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$(mktemp -d)"
          keychain="$signing_dir/vibepad-release.keychain-db"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$signing_dir/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$signing_dir/AuthKey.p8"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$signing_dir/developer-id.p12" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          xcrun notarytool store-credentials vibepad-notary --key "$signing_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
      - name: Build, sign, and notarize universal Host
        if: ${{ env.MACOS_DEVELOPER_IDENTITY != '' }}
        run: bun run host:release --target macos-universal --version "${{ inputs.version }}" --sign-identity "$MACOS_DEVELOPER_IDENTITY" --notary-profile vibepad-notary
      - name: Build universal Host without publication
        if: ${{ !inputs.publish && env.MACOS_DEVELOPER_IDENTITY == '' }}
        run: bun run host:release --target macos-universal --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vibepad-host-macos-universal
          path: |
            dist/host/*.zip
            dist/host/*.sha256
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: dist/publish
          merge-multiple: true
      - name: Publish immutable release files
        shell: bash
        run: |
          set -euo pipefail
          release_prefix="vibepad-downloads/host/v${{ inputs.version }}"
          for artifact in dist/publish/*; do
            name="$(basename "$artifact")"
            case "$name" in
              *.tar.gz) content_type="application/gzip" ;;
              *.zip) content_type="application/zip" ;;
              *.sha256) content_type="text/plain; charset=utf-8" ;;
              *) printf 'Unexpected release file: %s\n' "$name" >&2; exit 1 ;;
            esac
            bunx wrangler r2 object put "$release_prefix/$name" --remote --file "$artifact" --content-type "$content_type" --cache-control "public, max-age=31536000, immutable"
          done
      - name: Publish stable installer
        shell: bash
        run: |
          printf '%s\n' "${{ inputs.version }}" > dist/latest.txt
          bunx wrangler r2 object put vibepad-downloads/host/latest.txt --remote --file dist/latest.txt --content-type "text/plain; charset=utf-8" --cache-control "no-cache, must-revalidate"
          bunx wrangler r2 object put vibepad-downloads/host/latest-linux.txt --remote --file dist/latest.txt --content-type "text/plain; charset=utf-8" --cache-control "no-cache, must-revalidate"
          bunx wrangler r2 object put vibepad-downloads/host/latest-macos.txt --remote --file dist/latest.txt --content-type "text/plain; charset=utf-8" --cache-control "no-cache, must-revalidate"
          bunx wrangler r2 object put vibepad-downloads/host/install.sh --remote --file scripts/install-host.sh --content-type "text/x-shellscript; charset=utf-8" --cache-control "public, max-age=300, must-revalidate"
      - run: bun run --cwd apps/downloads deploy
